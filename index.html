<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<meta name="description" content="AfriArena : la communauté gaming africaine. Rejoins des joueurs, forme ton équipe et participe aux tournois.">
<title>AfriArena — La puissance du gaming africain</title>

<style>
:root {
  --bg: #090b14;
  --panel: #111525;
  --orange: #ff6b2c;
  --violet: #8b5cf6;
  --white: #f7f8ff;
  --muted: #9ca3b8;
  --border: rgba(255,255,255,.09);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  cursor: pointer;
}
.container {
  width: min(1120px, 92%);
  margin: auto;
}
</style>
</head>
<body>
  <style>
/* BARRE DE NAVIGATION */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(9,11,20,.94);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}
.navbar {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 23px;
  font-weight: 900;
  letter-spacing: -.8px;
}
.logo-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg,var(--orange),var(--violet));
  box-shadow: 0 0 25px rgba(139,92,246,.25);
  font-size: 23px;
}
.logo span {
  color: var(--orange);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 19px;
}
.nav-links a {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  transition: color .2s;
}
.nav-links a:hover {
  color: var(--white);
}
.nav-cta {
  background: var(--orange);
  color: #130d0a !important;
  padding: 10px 15px;
  border-radius: 9px;
}
.menu-btn {
  display: none;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 22px;
}
</style>

<header>
  <div class="container navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">⚡</div>
      Afri<span>Arena</span>
    </a>

    <button class="menu-btn" id="menuBtn"
      aria-label="Ouvrir le menu"
      aria-expanded="false">☰</button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Accueil</a>
      <a href="communaute.html">Communauté</a>
      <a href="adversaires.html">Adversaires</a>
      <a href="matchs.html">Matchs</a>
      <a href="tournois.html">Tournois</a>
      <a href="equipes.html">Équipes</a>
      <a href="connexion.html" class="nav-cta">Connexion</a>
    </nav>
  </div>
</header>
